[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cfd-aq"
version = "1.0.0"
description = "Excrescence drag of surface steps and ridges, after AGARD-AG-264 (Young & Paterson, 1981)."
# 3.9 est l'interpréteur des bases RHEL 8 / Rocky 8 encore courantes sur les
# calculateurs isolés : le paquet doit s'y installer sans backport.
requires-python = ">=3.9"
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Paquets frères du dépôt (pas sur PyPI) : à installer en editable depuis
# tools/. cfd-atm déverrouille ISA ± ΔT, les altitudes pression et
# géopotentielle, et les conversions Vc / EAS / TAS ; cfd-plot porte le style
# des figures. cfd-aq reste utilisable sans eux, en mode dégradé documenté.
#     pip install -e tools/cfd-atm -e tools/cfd-plot
suite = []
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-PyYAML",
]

[project.scripts]
cfd-aq = "cfd_aq.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cfd_aq = ["01_EXEMPLE/*"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

# Les docs, le rapport et les étiquettes de figures en français utilisent
# légitimement le tiret demi-cadratin, le signe moins, le signe multiplier,
# l'apostrophe courbe et l'espace insécable ; ce ne sont pas des homoglyphes
# fautifs. Les lettres grecques sont des symboles de physique (ρ masse
# volumique, ν viscosité cinématique, μ viscosité dynamique, τ cisaillement,
# δ épaisseur de couche limite, θ angle de chanfrein, α angle de dérapage,
# γ rapport des chaleurs massiques), pas des sosies de lettres latines.
allowed-confusables = ["–", "−", "×", "’", " ", "ρ", "ν", "μ", "τ", "δ", "θ", "α", "γ", "σ", "Δ"]

[tool.ruff.lint.per-file-ignores]
# L'idiome `value == pytest.approx(expected)` se lit naturellement ; ne pas l'inverser.
"tests/**" = ["SIM300"]

[tool.ruff.lint.isort]
known-first-party = ["cfd_aq"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
# Pas de python_version = "3.9" : mypy ne sait plus cibler 3.9. La compatibilité
# 3.9 est tenue par le code et vérifiée en exécutant la suite de tests sous un
# interpréteur 3.9 (ruff, lui, cible bien py39 et refuse la syntaxe trop récente).
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["matplotlib.*"]
ignore_missing_imports = true

# cfd-plot et cfd-atm sont des paquets frères du dépôt, pas des publications
# PyPI : ils ne peuvent pas être déclarés en dépendance et peuvent légitimement
# manquer à l'environnement où tourne mypy. Voir core/atmosphere.py et
# report/_plotting_lib.py.
[[tool.mypy.overrides]]
module = ["cfd_atm", "cfd_plot"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

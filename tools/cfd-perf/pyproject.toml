[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cfd-perf"
version = "1.1.0"
description = "Sur combien de cœurs lancer une simulation CFD ? Modèle de scalabilité forte ajusté sur des mesures pilotes."
# 3.9 est l'interpréteur des bases RHEL 8 / Rocky 8 encore courantes sur les
# calculateurs isolés : le paquet doit s'y installer sans backport.
requires-python = ">=3.9"
license = { text = "MIT" }
readme = "README.md"
keywords = ["cfd", "hpc", "mpi", "scalability", "strong-scaling", "openfoam", "slurm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: French",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
# Bornes basses volontairement larges : sur un calculateur isolé on installe
# avec les roues déjà présentes dans le cache, souvent celles de la distribution.
dependencies = [
    "numpy>=1.20",
    "matplotlib>=3.4",
    "rich>=12.0",
    "pyyaml>=5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-PyYAML",
]

[project.scripts]
cfd-perf = "cfd_perf.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

# Les adaptateurs bash et l'exemple sont livrés *dans* le paquet : « pip install »
# suffit, sans dépôt cloné à côté (voir src/cfd_perf/paths.py).
[tool.setuptools.package-data]
cfd_perf = [
    "py.typed",
    "ADAPTATEUR/*.sh",
    "ADAPTATEUR/*.yaml",
    "ADAPTATEUR/*.md",
    "ADAPTATEUR/tests/*.sh",
    "01_EXEMPLE/*.yaml",
    "01_EXEMPLE/*.sh",
]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

# Les docs, le rapport et les libellés de figures en français utilisent
# légitimement tirets demi-cadratins, signes moins, signes multiplier,
# apostrophes typographiques et espaces insécables : ce ne sont pas des
# homoglyphes accidentels.
allowed-confusables = ["–", "−", "×", "’", " "]

[tool.ruff.lint.per-file-ignores]
# Script/notebook apparié écrit en cellules jupytext : chaque cellule importe ce
# dont elle a besoin, d'où des imports légitimes après la première cellule.
"00_DOC/checkpoint_demo.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["cfd_perf"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
# Pas de python_version = "3.9" : mypy ne sait plus cibler 3.9. La compatibilité
# 3.9 est tenue par le code (voir src/cfd_perf/_compat.py) et vérifiée en
# exécutant la suite de tests sous un interpréteur 3.9.
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["matplotlib.*"]
ignore_missing_imports = true

# cfd-plot est un paquet compagnon optionnel (voir report/_plotting_lib.py) ;
# il peut légitimement être absent de l'environnement où mypy tourne.
[[tool.mypy.overrides]]
module = ["cfd_plot"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

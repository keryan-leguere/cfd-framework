[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cfd-perf"
version = "1.0.0"
description = "How many CPUs should I launch my CFD simulation on?"
requires-python = ">=3.12"
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-PyYAML",
]

[project.scripts]
cfd-perf = "cfd_perf.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

# French docs, report and figure labels legitimately use en dashes, minus
# signs, multiplication signs, curly apostrophes and non-breaking spaces;
# they are not homoglyph mistakes.
allowed-confusables = ["–", "−", "×", "’", " "]

[tool.ruff.lint.per-file-ignores]
# Paired script/notebook written in jupytext cell style: each cell imports what
# it needs, so module-level imports legitimately appear below the first cell.
"checkpoint_demo.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["cfd_perf"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["matplotlib.*"]
ignore_missing_imports = true

# cfd-plot is an optional sibling package (see report/_plotting_lib.py); it
# may legitimately be absent from the environment mypy runs in.
[[tool.mypy.overrides]]
module = ["cfd_plot"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

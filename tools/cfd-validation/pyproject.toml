[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cfd-validation"
version = "0.1.0"
description = "Utilitaires de vérification de code (Fortran 77, C) : tests tracés, rapport de preuve."
# 3.9 est l'interpréteur des bases RHEL 8 / Rocky 8 encore courantes sur les
# calculateurs isolés : le paquet doit s'y installer sans backport.
requires-python = ">=3.9"
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    "numpy>=1.26",
    "pandas>=1.5",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Les figures passent par cfd-plot, paquet frère de ce dépôt (pas sur PyPI) :
#   pip install -e ../cfd-plot
# Sans lui, rapport terminal, journal, CSV et JSON sont produits quand même.
figures = ["matplotlib>=3.5"]
# Lecture des fichiers Parquet/Feather par la commande ``cfd-validation integration``.
parquet = ["pyarrow"]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-PyYAML",
    "pandas-stubs",
    "matplotlib>=3.5",
]

[project.scripts]
cfd-validation = "cfd_validation.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cfd_validation = ["01_EXEMPLE/*.py", "01_EXEMPLE/*.md", "01_EXEMPLE/*.sh", "01_EXEMPLE/*.yaml"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

# Docs, rapport et messages sont en français : tirets, signe moins, signe
# multiplié, apostrophes courbes et espaces insécables sont voulus.
allowed-confusables = ["–", "−", "×", "’", " ", " ", "α", "β", "Δ", "σ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["SIM300"]
"src/cfd_validation/__init__.py" = ["I001", "RUF022"]

[tool.ruff.lint.isort]
known-first-party = ["cfd_validation"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
# mypy ne sait plus cibler 3.9 : la compatibilité est tenue par le code
# (``from __future__ import annotations`` partout) et par ruff (py39).
strict = true
warn_return_any = true
warn_unused_configs = true

# cfd-plot est un paquet frère de ce dépôt (voir report/figures.py), pas une
# publication PyPI : il n'a pas de marqueur py.typed.
[[tool.mypy.overrides]]
module = ["cfd_plot", "matplotlib", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

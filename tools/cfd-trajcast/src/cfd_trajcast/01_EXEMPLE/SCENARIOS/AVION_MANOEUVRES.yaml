# Trajectoire d'avion d'entraînement (maquette : l'AIM-9 fourni) : roulage et décollage en postcombustion, montée,
# virage à 60°, boucle (postcombustion rallumée), tonneau, descente en virage.
# Vue principale de poursuite ; dessous, la vue d'ensemble NED, une caméra au sol
# en bout de piste et la vue du cockpit. Télémétrie « avion ».
# Aperçu : cfd-trajcast rendre AVION_MANOEUVRES.yaml --apercu
etude:
  titre: "Démonstration en vol"
  sous_titre: "Décollage, montée et manœuvres — scénario synthétique"

trajectoire:
  fichier: avion_manoeuvres.csv
  repere: ENU
  attitude: { type: quaternion, colonnes: [qw, qx, qy, qz] }
  evenements: avion_manoeuvres_evenements.csv

maquette:
  fichier: ../MAQUETTE/Aim9.stl      # la CAO fournie, aussi pour les trajectoires d'avion
  unite: mm
  axe_nez: "-X"
  axe_haut: "+Z"
  origine: [19.05, 0, 0]
  longueur_imposee: 2.87

propulsion:
  rayon_tuyere: 0.08                 # m ; une tuyère au centre du culot (défaut)
  phases:
    - { de: "Mise en puissance", a: "Palier", jet: postcombustion }
    - { de: "Palier", a: "Boucle", jet: reacteur }
    - { de: "Boucle", a: "Rétablissement", jet: postcombustion }
    - { de: "Rétablissement", jet: reacteur }

video:
  resolution: 1080p
  ips: 30
  vitesse: 1.5                       # 190 s de vol en ~2 min, ralentis compris
  ralentis:
    - { de: 26.0,  a: 34.0,  vitesse: 0.75 }   # rotation et décollage
    - { de: 146.0, a: 151.0, vitesse: 0.4 }    # tonneau
  codec: { crf: 18, preset: medium }

vues:
  poursuite:
    mode: poursuite
    azimut: 35                       # légèrement à droite, derrière
    elevation: 8
    cadrage: 0.3
  ensemble: { mode: ensemble, elevation: 25 }
  sol:
    mode: sol
    position: [120, 1900, 2]         # à 120 m de l'axe de piste, au niveau de la rotation
    cadrage: 0.3
  cockpit:
    mode: embarquee
    position_corps: [-0.9, 0.0, -0.16]  # FRD : au-dessus du corps, en arrière, regard vers le nez
    visee: [1.0, 0.0, 0.06]
    champ: 70

disposition:
  type: libre
  cases:
    - { vue: poursuite,  rect: [0.0,   0.0,  0.74,  0.66] }
    - { vue: ensemble,   rect: [0.0,   0.66, 0.37,  0.34] }
    - { vue: sol,        rect: [0.37,  0.66, 0.185, 0.34] }
    - { vue: cockpit,    rect: [0.555, 0.66, 0.185, 0.34] }
    - { vue: telemetrie, rect: [0.74,  0.10, 0.26,  0.90] }

telemetrie:
  grandeurs:
    - { grandeur: vitesse, unite: kt }
    - { grandeur: altitude, unite: ft, libelle: "Altitude" }
    - { grandeur: facteur_de_charge, libelle: "Facteur de charge" }
    - { colonne: inclinaison, libelle: "Inclinaison", unite: "°", decimales: 0, plage: [-180, 180] }
    - { grandeur: pente }
    - { grandeur: cap, plage: [0, 360] }

style:
  preset: conference
  sol: { altitude: -0.4 }          # l'axe roule à 0,4 m du sol : les ailettes (0,75 m d'envergure) ne le touchent pas

montage:
  logo: { fichier: ../logo.png, coin: haut_droite, hauteur: 0.05 }
  coin_bandeaux: haut_gauche

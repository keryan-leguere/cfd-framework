# Le vol de FUSEE_BI_ETAGE.yaml, de nuit et en 4K (3840×2160) : préréglage `nuit`
# (ciel étoilé, clair de lune, flammes qui éclairent la maquette, la fumée et le sol,
# halo de lueur), vue d'ensemble sombre. Rendu parallèle conseillé :
#   cfd-trajcast rendre FUSEE_NUIT_4K.yaml              (automatique)
# Aperçu (540p) : cfd-trajcast rendre FUSEE_NUIT_4K.yaml --apercu
etude:
  titre: "Fusée à deux étages — tir de nuit"
  sous_titre: "Scénario synthétique — cfd-trajcast"

trajectoire:
  fichier: fusee_bi_etage.csv
  repere: ENU
  attitude: { type: quaternion, colonnes: [qw, qx, qy, qz] }
  evenements: fusee_bi_etage_evenements.csv      # CSV t,nom écrit par generer_scenarios.py

maquette:
  fichier: ../MAQUETTE/Aim9.stl
  unite: mm
  axe_nez: "-X"
  axe_haut: "+Z"
  origine: [19.05, 0, 0]
  longueur_imposee: 2.87

propulsion:
  rayon_tuyere: 0.08                 # m ; tuyère au centre du culot (défaut)
  phases:
    - { de: "Allumage étage 1", a: "Séparation", jet: fusee_poudre }
    - { de: "Allumage étage 2", a: "Fin de propulsion",
        jet: { base: fusee_liquide, flamme: { longueur: 9 } } }

video:
  resolution: 4K
  ips: 30
  vitesse: 1.0
  ralentis:
    - { de: 2.5, a: 5.5, vitesse: 0.25 }    # fin d'étage 1, séparation, allumage d'étage 2
  codec: { crf: 18, preset: medium }

vues:
  cinema:
    mode: images_cles
    cadrage: 0.3
    cles:
      - { t: 0.0,  azimut: 150, elevation: 5 }
      - { t: 3.0,  azimut: 70,  elevation: 5 }
      - { t: 6.0,  azimut: 25,  elevation: 12 }
      - { t: 14.0, azimut: 90,  elevation: 8 }
      - { t: 58.0, azimut: 100, elevation: 0 }
  ensemble: { mode: ensemble }
  sol: { mode: sol, position: [800, -300, 2], cadrage: 0.2 }

disposition:
  type: incrustation
  principale: cinema
  incrustations:
    - { vue: ensemble, coin: haut_droite, largeur: 0.24 }
    - { vue: sol,      coin: bas_droite,  largeur: 0.22 }
  telemetrie: droite

telemetrie:
  grandeurs:
    - { grandeur: altitude, unite: km }
    - mach
    - { grandeur: facteur_de_charge, libelle: "Facteur de charge" }
    - { grandeur: pente, libelle: "Pente" }

style:
  preset: nuit

montage:
  logo: { fichier: ../logo.png, coin: bas_gauche, hauteur: 0.05 }
  coin_bandeaux: haut_gauche

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cfd-atm"
version = "1.0.0"
description = "Atmosphere model: air conditions and flight-mechanics airspeeds from an altitude."
# 3.9 est l'interpréteur des bases RHEL 8 / Rocky 8 encore courantes sur les
# calculateurs isolés : le paquet doit s'y installer sans backport.
requires-python = ">=3.9"
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-PyYAML",
]

[project.scripts]
cfd-atm = "cfd_atm.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

# French docs, report and figure labels legitimately use en dashes, minus
# signs, multiplication signs, curly apostrophes and non-breaking spaces;
# they are not homoglyph mistakes. The Greek letters ρ, ν, σ are physics
# symbols (density, kinematic viscosity, density ratio), not Latin lookalikes.
allowed-confusables = ["–", "−", "×", "’", " ", "ρ", "ν", "σ"]

[tool.ruff.lint.per-file-ignores]
# The `value == pytest.approx(expected)` idiom reads naturally; don't flip it.
"tests/**" = ["SIM300"]

[tool.ruff.lint.isort]
known-first-party = ["cfd_atm"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
# Pas de python_version = "3.9" : mypy ne sait plus cibler 3.9. La compatibilité
# 3.9 est tenue par le code et vérifiée en exécutant la suite de tests sous un
# interpréteur 3.9 (ruff, lui, cible bien py39 et refuse la syntaxe trop récente).
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["matplotlib.*"]
ignore_missing_imports = true

# cfd-plot is an optional sibling package (see report/_plotting_lib.py); it
# may legitimately be absent from the environment mypy runs in.
[[tool.mypy.overrides]]
module = ["cfd_plot"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

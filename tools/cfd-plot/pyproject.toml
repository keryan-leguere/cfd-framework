[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cfd-plot"
version = "1.2.0"
description = "Matplotlib figure template: house styles, 1D/2D helpers, batch curve comparison and GIF/MP4 animation for CFD post-processing."
# 3.9 est l'interpréteur des bases RHEL 8 / Rocky 8 encore courantes sur les
# calculateurs isolés : le paquet doit s'y installer sans backport.
requires-python = ">=3.9"
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    # Required, not optional: cfd_plot/__init__.py re-exports batch.py,
    # which imports pandas at module level.
    "pandas>=2.0",
    # Matplotlib already pulls Pillow in, but cfd_plot.anim imports it
    # directly (GIF encoding, frame introspection), so it is declared rather
    # than relied on transitively.
    "pillow>=10.0",
]

[project.optional-dependencies]
# The interpolation helpers in field2d.py (`interpolate_field2d`,
# `plot_pcolormesh_interp`). Formerly named `dispersion`, back when
# cfd_plot.dispersion needed SciPy too — that submodule now lives in the
# sibling package tools/cfd-dispersion, which does not use SciPy at all.
interp = ["scipy>=1.11"]
# Pretty terminal tables from print_file_report and batch reporting.
rich = ["rich>=13.0"]
# Clickable outline (PDF bookmarks) on reports from cfd_plot.pdf. Strictly
# optional: without it the report is written identically, minus the outline.
# Matplotlib cannot write a PDF outline, which is the whole reason this exists.
pdf = ["pypdf>=4.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "pytest-mpl",
    "ruff",
    "mypy",
    "scipy>=1.11",
    "rich>=13.0",
    # Also the only way to read a PDF back, so the report tests need it.
    "pypdf>=4.0",
    "pandas-stubs",
    "scipy-stubs",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cfd_plot = ["fonts/*.otf", "fonts/*.ttf", "styles/*.mplstyle"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long — handled by formatter
    "E741",   # ambiguous variable name (x, y, l common in plotting)
    "B006",   # mutable default argument in function — intentional for dict defaults
    "SIM108", # ternary operator — readability preference
    "RUF012", # mutable class variable — not relevant here
]

# French docs, report and figure labels legitimately use en dashes, minus
# signs, multiplication signs, curly apostrophes and non-breaking spaces;
# they are not homoglyph mistakes. The Greek letters are physics symbols
# (σ standard deviation, α angle of attack, ρ density, ν viscosity, µ mean),
# not Latin lookalikes.
allowed-confusables = ["–", "−", "×", "’", " ", "σ", "α", "ρ", "ν", "µ"]

[tool.ruff.lint.per-file-ignores]
# The public API is grouped by topic (styles, 2D scalar, 2D vector, batch, …)
# with section banners. That grouping is documentation — don't alphabetise it.
"src/cfd_plot/__init__.py" = ["I001", "RUF022"]
# Grouped by layer (sugar / engine / encoder / presets), which is how the
# module is meant to be read. Alphabetising it would hide that.
"src/cfd_plot/anim/__init__.py" = ["RUF022"]
# Same reason: pages / contact sheets / reports / outline, the order the layers
# build on each other.
"src/cfd_plot/pdf/__init__.py" = ["RUF022"]
"01_EXEMPLE/demo_plotting.py" = [
    "E402",   # module-level import not at top — notebook-style cells
    "E702",   # multiple statements on one line — compact xlabel/ylabel pairs
    "I001",   # unsorted imports — cells import as needed
]
"tests/**" = [
    "SIM300",  # `value == pytest.approx(expected)` reads naturally; don't flip it
    "RUF059",  # `fig, ax = plot_x(...)` — unpacking the unused `fig` documents the API
]

[tool.ruff.lint.isort]
known-first-party = ["cfd_plot"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
# Pas de python_version = "3.9" : mypy ne sait plus cibler 3.9. La compatibilité
# 3.9 est tenue par le code et vérifiée en exécutant la suite de tests sous un
# interpréteur 3.9 (ruff, lui, cible bien py39 et refuse la syntaxe trop récente).
# NOT `strict = true`, unlike the sibling packages. cfd-plot predates them and
# its public helpers are largely unannotated: strict currently reports ~132
# missing-annotation errors (no-untyped-def / type-arg / no-any-return). The
# settings below are everything strict gives us that the code already
# satisfies — in particular `check_untyped_defs`, which type-checks the bodies
# of unannotated functions. Tightening to full strict is tracked in TODO.md.
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["matplotlib.*", "mpl_toolkits.*"]
ignore_missing_imports = true

# The modules added after the strict decision are held to the strict rules from
# the start. Retrofitting the older ones is the TODO.md item; letting new code
# join them there is how that list stops shrinking.
#
# Two deliberate choices here:
#
# * Spelled out rather than `strict = true`. In a per-module section that flag
#   leaks into modules it does not name — the older files' errors come back and
#   the count goes 157 -> 159, which is the opposite of scoping it.
# * `disallow_untyped_calls` stays off. The only calls it would flag are
#   `PdfPages.savefig` / `PdfPages.close`: matplotlib ships no stubs for
#   `backend_pdf`, so they read as untyped. That is an upstream stub gap, not
#   unannotated code of ours, and silencing it per-call would only add noise.
[[tool.mypy.overrides]]
module = ["cfd_plot.pdf.*", "cfd_plot.layout", "cfd_plot.palettes", "cfd_plot.cleanup"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_subclassing_any = true
disallow_any_generics = true
no_implicit_reexport = true
warn_return_any = true
extra_checks = true

[[tool.mypy.overrides]]
module = ["pypdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "mpl_image_compare: figure is compared against a baseline PNG (pytest-mpl)",
]
# Matplotlib deprecations are how this library breaks: `Colormap.set_bad` went
# pending-deprecated under our feet and would have silently taken `bad_color`
# with it. Fail on our own deprecated usage instead of letting it scroll past.
filterwarnings = [
    "error::DeprecationWarning:cfd_plot.*",
    "error::PendingDeprecationWarning:cfd_plot.*",
]

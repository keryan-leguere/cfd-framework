# cfd-stats analysis configuration
# Pass with:  cfd-stats analyze data.pickle --config example_config.yaml

convergence_threshold: 1.0e-6
plateau_window: 100
cauchy_window: 200
cauchy_eps: 1.0e-4

min_periods_required: 10
fft_confidence_threshold: 0.7
autocorr_threshold: 0.5

confidence_level: 0.95
bootstrap_samples: 1000
max_moment_order: 4

quality_thresholds:
  excellent: 0.95
  good: 0.80
  acceptable: 0.60
  poor: 0.40

output_formats:
  - txt
  - json

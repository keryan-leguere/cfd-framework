name: CI

# Runs the quality gates of each standalone Python package on a *fresh* machine:
# pytest, ruff and mypy — the same three commands you run by hand.
#
# Two packages are deliberately absent for now — a permanently red pipeline
# gets ignored, which defeats the point:
#
#   tools/cfd-stats    5 tests fail on SciPy >= 1.18 (a TypeError raised inside
#                      scipy.stats.kstest) and ~33 ruff errors.
#   tools/slurm-utils  no test suite at all (pytest exits 5, "nothing collected").
#
# Add either to the matrix below once it is green.

on:
  push:
    branches: [main, "refonte-*"]
  pull_request:
  workflow_dispatch: # lets you trigger a run by hand from the Actions tab

# A new push to the same branch cancels the previous, still-running job.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg # no display on a CI runner
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  python:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      # The packages are independent: one failing must not hide the others.
      fail-fast: false
      matrix:
        package: [cfd-plot, cfd-perf, cfd-atm, cfd-validation]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # every package sets requires-python = ">=3.12"
          cache: pip
          cache-dependency-path: tools/*/pyproject.toml

      # cfd-plot first, and for every package: cfd-perf and cfd-atm have tests
      # that only exercise the house-style figure path when it is importable,
      # and silently *skip* otherwise. Installing it unconditionally keeps
      # those tests meaningful instead of quietly passing.
      # cfd_plot.anim prefers ffmpeg for GIF (one palette for the whole
      # sequence, via palettegen/paletteuse) and requires it for MP4. Without
      # it the suite still passes — it falls back to the Pillow encoder and
      # skips the rest — but the *primary* encoder would then never be
      # exercised in CI, which is how the fallback ends up better tested than
      # the real path.
      - name: Install ffmpeg (cfd-plot animation encoder)
        if: matrix.package == 'cfd-plot'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install cfd-plot (optional dependency of the other packages)
        run: pip install -e tools/cfd-plot

      # cfd-validation's whole suite runs without a compiler (its fake f2py
      # module is the test double), and the nine tests that compile real
      # Fortran skip themselves when the toolchain is missing. Installing
      # gfortran plus f2py's meson backend here keeps those nine meaningful:
      # they are the only ones that exercise what f2py *actually* produces
      # (callable COMMON-block objects, lowercased names, Fortran-contiguous
      # arrays), none of which can be guessed from the fake.
      - name: Install gfortran and the f2py meson backend (cfd-validation)
        if: matrix.package == 'cfd-validation'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gfortran
          pip install -e "tools/cfd-validation[build]"

      - name: Install ${{ matrix.package }}
        run: pip install -e "tools/${{ matrix.package }}[dev]"

      - name: pytest
        working-directory: tools/${{ matrix.package }}
        run: pytest

      # Image regression (pytest-mpl), cfd-plot only. Kept as its own
      # non-blocking step on purpose: baselines are pixel comparisons, so a
      # different FreeType/Agg build on the runner can shift them for reasons
      # unrelated to the library. Reported, never merge-blocking, until we have
      # evidence that runner-vs-laptop drift stays inside the tolerance.
      # Promote to a hard gate (drop continue-on-error) once that holds.
      - name: pytest --mpl (image regression, advisory)
        if: matrix.package == 'cfd-plot'
        continue-on-error: true
        working-directory: tools/cfd-plot
        run: pytest tests/test_images.py --mpl

      - name: ruff check
        if: always() # report every gate, don't stop at the first failure
        working-directory: tools/${{ matrix.package }}
        run: ruff check .

      - name: mypy
        if: always()
        working-directory: tools/${{ matrix.package }}
        run: mypy src

  # cfd-trajcast has its own job: it supports Python 3.9 (the other packages start at
  # 3.12), it renders 3D offscreen (OpenGL through EGL, Mesa llvmpipe on a runner with
  # no GPU), and its example video is the useful artefact of a run.
  cfd-trajcast:
    name: cfd-trajcast (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    defaults:
      run:
        working-directory: tools/cfd-trajcast
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: tools/cfd-trajcast/pyproject.toml

      # Mesa gives EGL a software device (llvmpipe); xvfb is the documented fallback
      # (00_DOC/04_RENDU_HORS_ECRAN.md) when the EGL path is not available.
      - name: Install Mesa (EGL, llvmpipe) and xvfb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libegl-mesa0 libgl1-mesa-dri libglx-mesa0 xvfb

      # [rocketpy] is marker-gated (RocketPy needs Python >= 3.10): on 3.9 the
      # RocketPy tests skip themselves, on 3.12 they run a real simulation.
      - name: Install cfd-trajcast
        run: pip install -e ".[dev,step,rocketpy]"

      # The suite's rendering tests skip when no offscreen window works, which would
      # turn a broken runner into a quietly green build. `diagnostic` exits 2 when
      # nothing renders: EGL first, then the same commands under xvfb.
      - name: Offscreen rendering (EGL, else xvfb)
        id: rendu
        run: |
          if cfd-trajcast diagnostic; then echo "lanceur=" >> "$GITHUB_OUTPUT"
          else xvfb-run -a cfd-trajcast diagnostic && echo "lanceur=xvfb-run -a" >> "$GITHUB_OUTPUT"; fi

      - name: pytest
        run: ${{ steps.rendu.outputs.lanceur }} pytest

      - name: ruff check
        if: always()
        run: ruff check .

      # The NumPy stubs of the oldest supported NumPy disagree with the newest on four
      # pre-existing lines; mypy strict is the gate on the newest interpreter only.
      - name: mypy
        if: always() && matrix.python == '3.12'
        run: mypy src

      - name: Example video (preview)
        if: matrix.python == '3.12'
        run: |
          cfd-trajcast exemple ex
          cd ex && ${{ steps.rendu.outputs.lanceur }} cfd-trajcast rendre CONFIG_MULTIVUES.yaml --apercu

      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: cfd-trajcast-apercu
          path: tools/cfd-trajcast/ex/CONFIG_MULTIVUES_apercu.mp4
          if-no-files-found: error

# A job for the Bash framework (tests/test_sprint1_2.sh with CFD_ADAPTATEUR=mock)
# is intentionally NOT here yet: that suite currently aborts on its first `h1`
# call. lib/format.sh uses `((sec++))`, which returns exit status 1 when the
# counter is still 0, and the suite runs under `set -euo pipefail`. Fix that
# (`((sec++)) || true`, or `sec=$((sec + 1))`) and the job becomes a ~10-line
# addition.

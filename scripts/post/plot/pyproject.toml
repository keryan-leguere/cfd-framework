[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long — handled by formatter
    "E741",   # ambiguous variable name (x, y, l common in plotting)
    "B006",   # mutable default argument in function — intentional for dict defaults
    "SIM108", # ternary operator — readability preference
    "RUF012", # mutable class variable — not relevant here
]

[tool.ruff.lint.per-file-ignores]
"demo_plotting.py" = [
    "E402",   # module-level import not at top — notebook-style cells
    "E702",   # multiple statements on one line — compact xlabel/ylabel pairs
    "I001",   # unsorted imports — cells import as needed
]

[tool.ruff.lint.isort]
known-first-party = ["plotting"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
